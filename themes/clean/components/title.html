<style>
ROOT .ttl { display: block; text-align: center; }
ROOT .ttl .kicker { display: block; font: 800 40px var(--font); letter-spacing: 0.2em; color: var(--accent); margin-bottom: 24px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
ROOT .ttl .logo { display: block; height: 120px; margin: 0 auto 24px; }
ROOT .ttl .title { display: block; max-width: 960px; margin: 0 auto; font: 900 150px/1 var(--font); color: var(--text); text-transform: uppercase; text-shadow: var(--shadow); }
ROOT .ttl .title.sm { font-size: 120px; }
ROOT .ttl .title.xs { font-size: 96px; }
html.f169 ROOT .ttl { text-align: right; }
html.f169 ROOT .ttl .kicker { font-size: 24px; margin-bottom: 12px; }
html.f169 ROOT .ttl .logo { height: 72px; margin: 0 0 12px auto; }
html.f169 ROOT .ttl .title { max-width: 520px; margin: 0 0 0 auto; font-size: 84px; }
html.f169 ROOT .ttl .title.sm { font-size: 68px; }
html.f169 ROOT .ttl .title.xs { font-size: 54px; }
</style>
<script>
const band = U.el("div", "band");
const box = U.el("div", "ttl", null, band);
if (P.kicker) {
  const k = U.el("div", "kicker", P.kicker, box);
  tl.fromTo(k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, Math.max(0, P.at - 0.25));
}
if (P.logo) {
  const im = U.el("img", "logo", null, box);
  im.src = P.logo;
  tl.fromTo(im, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, Math.max(0, P.at - 0.15));
}
const n = String(P.text).length;
const t = U.el("div", "title" + (n > 16 ? " xs" : n > 10 ? " sm" : ""), P.text, box);
tl.fromTo(t, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, P.at);
U.out(band, P.end - 0.2);
</script>
