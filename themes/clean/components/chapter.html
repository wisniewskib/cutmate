<style>
ROOT .chapter { position: absolute; inset: 0; background: #0b0b0f; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 28px; opacity: 0; font-family: var(--font); }
ROOT .chapter .ch-num { font-weight: 800; font-size: 40px; letter-spacing: 0.3em; color: var(--accent); }
ROOT .chapter .ch-title { max-width: 900px; font-weight: 900; font-size: 96px; line-height: 1.05; color: var(--text); text-align: center; }
html.f169 ROOT .chapter .ch-title { max-width: 1500px; font-size: 110px; }
</style>
<markup><div class="chapter"><span class="ch-num">{{label}}</span><span class="ch-title">{{title}}</span></div></markup>
<script>
const c = root.querySelector(".chapter");
tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, P.at);
tl.fromTo(root.querySelector(".ch-title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, P.at + 0.1);
tl.to(c, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, Math.max(P.at + 0.35, P.end - 0.25));
</script>
