<style>
ROOT .list { display: flex; flex-direction: column; gap: 14px; width: 100%; }
ROOT .list .head { display: block; font: 800 34px var(--font); letter-spacing: 0.2em; color: var(--accent); text-align: center; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
ROOT .list .item { display: block; background: var(--card); color: var(--ink); border-radius: 24px; padding: 16px 30px; font: 800 50px/1.1 var(--font); opacity: 0; }
ROOT .list .item.sm { font-size: 42px; }
html.f169 ROOT .list { gap: 10px; }
html.f169 ROOT .list .head { font-size: 22px; text-align: right; }
html.f169 ROOT .list .item { border-radius: 16px; padding: 10px 20px; font-size: 30px; }
html.f169 ROOT .list .item.sm { font-size: 26px; }
</style>
<script>
const band = U.el("div", "band");
const list = U.el("div", "list", null, band);
if (P.head) {
  const h = U.el("div", "head", P.head, list);
  tl.fromTo(h, { opacity: 0 }, { opacity: 1, duration: 0.2 }, Math.min(...P.items.map((it) => it.at)));
}
P.items.forEach((it) => {
  const e = U.el("div", "item" + (String(it.text).length > 22 ? " sm" : ""), it.text, list);
  tl.fromTo(e, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, it.at);
});
U.out(band, P.end - 0.2);
</script>
