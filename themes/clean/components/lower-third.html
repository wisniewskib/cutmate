<style>
ROOT .lt { position: absolute; left: 80px; top: 820px; max-width: 820px; background: var(--card); color: var(--ink);
      border-left: 10px solid var(--accent); border-radius: 18px; padding: 18px 32px; box-shadow: var(--shadow); font-family: var(--font); }
ROOT .lt .lt-name { display: block; font-weight: 800; font-size: 46px; line-height: 1.1; }
ROOT .lt .lt-role { display: block; font-weight: 500; font-size: 30px; color: var(--muted); margin-top: 4px; }
</style>
<markup><div class="lt"><span class="lt-name">{{name}}</span><span class="lt-role">{{role}}</span></div></markup>
<script>
const lt = root.querySelector(".lt");
if (!P.role) root.querySelector(".lt-role").remove();
tl.fromTo(lt, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, P.at);
U.out(lt, P.end - 0.2);
</script>
