<style>
ROOT .hc { position: absolute; inset: 0; overflow: hidden; }
ROOT .hc canvas { position: absolute; left: 0; top: 0; }
ROOT .hc-card { position: absolute; left: 0; top: 0; box-sizing: border-box; visibility: hidden; overflow: hidden;
  background: var(--card, rgba(255, 255, 255, 0.94)); border-radius: var(--radius, 28px);
  box-shadow: var(--shadow, 0 10px 30px rgba(0, 0, 0, 0.35)), 0 0 0 2px var(--accent, #7dd3fc), 0 0 46px var(--accent, #7dd3fc);
  color: var(--ink, #0f172a); font-family: var(--font, sans-serif); transform-origin: 50% 100%; will-change: transform, opacity; }
ROOT .hc-card > * { position: relative; }
ROOT .hc-bar { display: block; border-radius: 99px; background: var(--accent, #7dd3fc); }
ROOT .hc-media { display: block; width: 100%; background-size: cover; background-position: center; }
ROOT .hc-title { font-family: var(--font-display, var(--font, sans-serif)); font-weight: 900; font-synthesis: none;
  letter-spacing: -0.02em; line-height: 1.08; color: var(--ink, #0f172a); }
ROOT .hc-line { display: flex; align-items: baseline; font-weight: 600; line-height: 1.3; color: var(--ink, #0f172a); }
ROOT .hc-line i { flex: none; border-radius: 50%; background: var(--accent, #7dd3fc); }
</style>
<markup><div class="hc"></div></markup>
<script>
// hand-control (WOW overlay, index.json "tips": needs fingertip tracks): hot streak sparks stream from every extended
// fingertip of the chosen hand, and while that palm is open a card unfolds from it (hinge at the card's bottom edge,
// P.lift px above the palm) and follows the hand; it folds back when the palm closes. No open palm: the card stays
// folded. No track at all: hidden. Sparks are pure functions of t (birth slot + seeded randomness), the card a pure
// function of the palm series — any frame renders the same alone. Inputs (build, region px, local s): P.tips[side] =
// 5 × [[t, x, y, ext]] (thumb … pinky), P.palm_open[side] = [[t, 0|1]], P.palms[side] = [[t, x, y]], P.faces =
// [[t, x, y]] (the face, the card keeps off it), P.lift, P.safe.

// ---- pure helpers (window.CutmateFX.wow, registered once) ----
const HC_N = 90, HC_LIFE = 0.5, HC_HOLD = 0.25;
const hcClamp = (v, a, b) => Math.min(b, Math.max(a, v));
// the hand the effect uses: params.hand "left" / "right" when tracked, else the side with the most open-palm samples
// (then the most samples; ties: right). null when no hand was tracked at all
function hcSide(P) {
  const has = (s) => (P.palms && P.palms[s] && P.palms[s].length) || (P.tips && P.tips[s] && P.tips[s].some((x) => x && x.length));
  const sides = ["right", "left"].filter(has);
  if (!sides.length) return null;
  if ((P.hand === "left" || P.hand === "right") && sides.includes(P.hand)) return P.hand;
  const score = (s) => { const po = (P.palm_open && P.palm_open[s]) || [];
    return [po.filter((p) => p[1] >= 0.5).length, po.length + (((P.palms || {})[s]) || []).length]; };
  return sides.reduce((a, b) => { const x = score(a), y = score(b); return y[0] > x[0] || (y[0] === x[0] && y[1] > x[1]) ? b : a; });
}
// a fingertip at t: [x, y, ext] (position interpolated, ext of the latest sample), null outside the track (+0.25 s)
function hcTipAt(tr, t) {
  if (!tr || !tr.length) return null;
  const first = tr[0], last = tr[tr.length - 1];
  if (t < first[0]) return first[0] - t > HC_HOLD ? null : [first[1], first[2], first[3]];
  if (t >= last[0]) return t - last[0] > HC_HOLD ? null : [last[1], last[2], last[3]];
  for (let i = 1; i < tr.length; i++) {
    const b = tr[i];
    if (t < b[0]) {
      const a = tr[i - 1], f = (t - a[0]) / (b[0] - a[0] || 1);
      return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3]];
    }
  }
  return [last[1], last[2], last[3]];
}
// every live spark at t: born every HC_LIFE / HC_N s per tip, only from a tip that is tracked and extended at its birth,
// flying out along palm → tip with drag and gravity. {tip, ex, ey (the tip at birth), x, y (head), tx, ty (tail), age,
// life (0–1), size, hot (0–1)}
function tipSparks(P, t) {
  if (P.sparks === "off") return [];
  const side = hcSide(P);
  if (!side) return [];
  const FX = window.CutmateFX.pure, m = Math.min(P.w, P.h), K = Math.max(0.3, Number(P.size) || 1);
  const at = Number(P.at) || 0, end = Number(P.end) || at + 4;
  const palm = (P.palms || {})[side], tips = ((P.tips || {})[side]) || [], out = [];
  tips.forEach((tr, k) => {
    if (!tr || !tr.length) return;
    for (let i = 0; i < HC_N; i++) {
      const slot = (t - at) / HC_LIFE - i / HC_N;
      const cyc = Math.floor(slot), age = (slot - cyc) * HC_LIFE, born = t - age;
      if (born < at || born > end - 0.2) continue;
      const e = hcTipAt(tr, born);
      if (!e || !(e[2] >= 0.5)) continue;
      const r = FX.seed(11 + k * 7919 + i * 104729 + (cyc + 1000) * 15485863);
      const pp = palm ? FX.trackAt(palm, born) : null;
      const dir = pp && Math.hypot(e[0] - pp[0], e[1] - pp[1]) > 4 ? Math.atan2(e[1] - pp[1], e[0] - pp[0]) : -Math.PI / 2;
      const ang = dir + (r() - 0.5) * 1.15, v = m * K * (0.45 + r() * 0.75), drag = 3.2, grav = m * 1.2;
      const pos = (a) => { const d = (v / drag) * (1 - Math.exp(-drag * a));
        return [e[0] + Math.cos(ang) * d, e[1] + Math.sin(ang) * d + 0.5 * grav * a * a]; };
      const h = pos(age), tl0 = pos(Math.max(0, age - 0.045));
      out.push({ tip: k, ex: e[0], ey: e[1], x: h[0], y: h[1], tx: tl0[0], ty: tl0[1], age, life: age / HC_LIFE,
                 size: (1.6 + r() * 1.8) * K * m / 1080, hot: r() });
    }
  });
  return out;
}
// the card at t (ch = its unscaled height): open (0–1, openAmount of the palm series, closed by P.end), e (eased:
// scaleY), the bottom-centre (cx, by) and scale s that keep it inside the SAFE box, off the burned captions and off the
// face, with its hinge P.lift above the palm; null with no palm track
function cardPose(P, t, ch) {
  const FX = window.CutmateFX.pure, side = hcSide(P);
  const palm = side && (P.palms || {})[side];
  const pp = palm && palm.length ? FX.trackAt(palm, t) : null;
  if (!pp) return null;
  const at = Number(P.at) || 0, end = Number(P.end) || at + 4;
  let open = t < at ? 0 : FX.openAmount(((P.palm_open || {})[side]) || [], t) * hcClamp((end - t) / 0.25, 0, 1);
  open = open < 1e-4 ? 0 : open;
  const c = 1.70158 * 1.15, u = open - 1, e = open <= 0 ? 0 : open >= 1 ? 1 : 1 + (c + 1) * u * u * u + c * u * u;
  const cw = hcClamp(0.42 * P.w, 360, 620), m = Math.min(P.w, P.h), pad = 0.02 * m;
  const sb = FX.safeBox(P), sf = Array.isArray(P.safe) && P.safe.length === 4 ? P.safe : [0, 0, P.w, P.h];
  const bx0 = Math.max(sb.x, sf[0]) + pad, by0 = Math.max(sb.y, sf[1]) + pad;
  const bx1 = Math.min(sb.x + sb.w, sf[0] + sf[2]) - pad, by1 = Math.min(sb.y + sb.h, sf[1] + sf[3]) - pad;
  const hx = pp[0], hy = pp[1] - (Number(P.lift) || 0);
  const s = hcClamp(Math.min((hy - by0) / Math.max(1, ch), (bx1 - bx0) / cw, (by1 - by0) / Math.max(1, ch)), 0.75, 1);
  const w = cw * s, h = ch * s;
  const fitX = (x) => (bx1 - bx0 >= w ? hcClamp(x, bx0 + w / 2, bx1 - w / 2) : (bx0 + bx1) / 2);
  let cx = fitX(hx);
  const by = by1 - by0 >= h ? hcClamp(hy, by0 + h, by1) : by1;
  // never over the face (P.faces: the tracked face, region px): pushed sideways off it, always to the same side for the
  // whole effect (the side the hand is on, on average) and by how much the card overlaps the face's height, so it
  // glides instead of jumping when the hand passes in front of the face
  const f = Array.isArray(P.faces) && P.faces.length ? FX.trackAt(P.faces, t) : null;
  if (f) {
    const fr = 0.17 * m, fy = f[1] - 0.02 * m, avg = (a) => a.reduce((v, q) => v + q[1], 0) / a.length;
    const dir = avg(palm) >= avg(P.faces) ? 1 : -1, need = f[0] + dir * (fr + w / 2 + 0.01 * m);
    const k = hcClamp((Math.min(by, fy + fr) - Math.max(by - h, fy - fr)) / (0.25 * fr), 0, 1);
    const target = dir > 0 ? Math.max(cx, need) : Math.min(cx, need);
    cx = fitX(cx + (target - cx) * k);
  }
  return { open, e, cx, by, s, cw, ch, palm: pp, hinge: [hx, hy] };
}
const WOW = (window.CutmateFX.wow = window.CutmateFX.wow || {});
Object.assign(WOW, { hcSide, hcTipAt, tipSparks, cardPose });

// ---- the effect ----
const box = root.querySelector(".hc");
const side = hcSide(P);
const cv = document.createElement("canvas"); cv.width = P.w; cv.height = P.h; box.appendChild(cv);
const g = cv.getContext("2d");
const m = Math.min(P.w, P.h);
const accent = U.token("--accent", "#7dd3fc");
const cols = Array.isArray(P.colors) && P.colors.length ? P.colors : ["#ffffff", accent];
const hot = cols[0], glow = cols[cols.length - 1];
// the card (DOM): accent bar, optional image, title, up to 3 lines with accent dots; sizes from its width
const cardP = P.card && typeof P.card === "object" ? P.card : { title: String(P.card || P.title || "") };
const cw = hcClamp(0.42 * P.w, 360, 620), padX = 0.07 * cw;
const card = U.el("div", "hc-card", null, box);
Object.assign(card.style, { width: cw + "px", padding: `${0.06 * cw}px ${padX}px ${0.07 * cw}px` });
const parts = [];
const bar = U.el("i", "hc-bar", null, card);
Object.assign(bar.style, { width: 0.16 * cw + "px", height: 0.022 * cw + "px", marginBottom: 0.045 * cw + "px" });
parts.push(bar);
const media = P.media || cardP.media;
if (media) {
  const im = U.el("div", "hc-media", null, card);
  Object.assign(im.style, { height: 0.5 * (cw - 2 * padX) + "px", borderRadius: `calc(var(--radius, 28px) * 0.55)`,
                            backgroundImage: `url('${media}')`, marginBottom: 0.05 * cw + "px" });
  parts.push(im);
}
const title = U.el("div", "hc-title", String(cardP.title || ""), card);
title.style.fontSize = 0.098 * cw + "px";
parts.push(title);
const lines = (Array.isArray(cardP.lines) ? cardP.lines : []).slice(0, 3);
lines.forEach((txt, k) => {
  const ln = U.el("div", "hc-line", null, card);
  Object.assign(ln.style, { fontSize: 0.064 * cw + "px", marginTop: (k ? 0.012 : 0.04) * cw + "px" });
  const dot = U.el("i", null, null, ln);
  Object.assign(dot.style, { width: 0.022 * cw + "px", height: 0.022 * cw + "px", marginRight: 0.03 * cw + "px",
                             transform: `translateY(${-0.006 * cw}px)` });
  U.el("span", null, String(txt), ln);
  parts.push(ln);
});
// height: an estimate now, the real one once the fonts are in (text is measured only after U.fonts)
let ch = 0.13 * cw + 0.067 * cw + (media ? 0.5 * (cw - 2 * padX) + 0.05 * cw : 0)
  + Math.max(1, Math.ceil(String(cardP.title || "").length * 0.55 * 0.098 * cw / (cw - 2 * padX))) * 0.098 * cw * 1.08
  + lines.reduce((a, l) => a + Math.ceil(String(l).length * 0.52 * 0.064 * cw / (cw - 2 * padX - 0.05 * cw)) * 0.064 * cw * 1.3 + 0.012 * cw, lines.length ? 0.028 * cw : 0);
U.ready(U.fonts([600, 900]).then(() => { if (card.offsetHeight > 0) ch = card.offsetHeight; }));
if (!side) { box.style.visibility = "hidden"; }

const rgba = (c, a) => {
  const s = String(c).trim();
  if (/^#[0-9a-f]{6}$/i.test(s)) { const n = parseInt(s.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${hcClamp(a, 0, 1)})`; }
  const v = s.match(/[\d.]+/g);
  return v && v.length >= 3 ? `rgba(${v[0]},${v[1]},${v[2]},${hcClamp(a, 0, 1)})` : `rgba(255,255,255,${hcClamp(a, 0, 1)})`;
};

U.clock((t) => {
  g.clearRect(0, 0, P.w, P.h);
  const vis = hcClamp((t - P.at) / 0.2, 0, 1) * hcClamp((P.end - t) / 0.3, 0, 1);
  const pose = side ? cardPose(P, t, ch) : null;
  // ---- the card ----
  const open = pose ? pose.open : 0;
  if (!pose || open <= 0) {
    card.style.visibility = "hidden";
    card.style.opacity = "0";
    card.style.transform = "translate(0px, 0px) scaleY(0)";
  } else {
    card.style.visibility = "visible";
    card.style.opacity = String(hcClamp(open * 3, 0, 1));
    card.style.transform = `translate(${(pose.cx - cw / 2).toFixed(2)}px, ${(pose.by - ch).toFixed(2)}px) perspective(1400px) `
      + `rotateX(${((1 - open) * 72).toFixed(2)}deg) scale(${pose.s.toFixed(4)}) scaleY(${pose.e.toFixed(4)})`;
    parts.forEach((el, k) => {
      const c = hcClamp((open - 0.3 - 0.1 * k) / 0.3, 0, 1);
      el.style.opacity = String(c);
      el.style.transform = `translateY(${((1 - c) * 0.06 * cw).toFixed(2)}px)`;
    });
  }
  if (vis <= 0 || !side) return;
  g.globalCompositeOperation = "lighter";
  // ---- light from the palm into the unfolding card ----
  if (pose && open > 0) {
    const [px, py] = pose.palm, w = cw * pose.s, top = pose.by;
    const gr = g.createLinearGradient(px, py, pose.cx, top);
    gr.addColorStop(0, rgba(glow, 0.55 * open * vis)); gr.addColorStop(1, rgba(glow, 0.06 * open * vis));
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(px - 0.03 * m, py); g.lineTo(pose.cx - w * 0.42, top); g.lineTo(pose.cx + w * 0.42, top);
    g.lineTo(px + 0.03 * m, py); g.closePath(); g.fill();
    const pg = g.createRadialGradient(px, py, 0, px, py, 0.12 * m);
    pg.addColorStop(0, rgba(hot, 0.7 * open * vis)); pg.addColorStop(0.3, rgba(glow, 0.4 * open * vis)); pg.addColorStop(1, rgba(glow, 0));
    g.fillStyle = pg; g.beginPath(); g.arc(px, py, 0.12 * m, 0, Math.PI * 2); g.fill();
  }
  if (P.sparks === "off") { g.globalCompositeOperation = "source-over"; return; }
  // sparks and glows fade out over the face (a hand raised by the face must not spray across it)
  const fc = Array.isArray(P.faces) && P.faces.length ? U.trackAt(P.faces, t) : null, fr = 0.17 * m;
  const offFace = (x, y) => (fc ? hcClamp((Math.hypot(x - fc[0], y - (fc[1] - 0.02 * m)) - 0.55 * fr) / (0.45 * fr), 0, 1) : 1);
  // ---- lit fingertips ----
  (((P.tips || {})[side]) || []).forEach((tr, k) => {
    const e = hcTipAt(tr, t);
    if (!e || !(e[2] >= 0.5)) return;
    const pulse = 1 + 0.15 * Math.sin(t * 13 + k * 1.7), R = 0.05 * m * pulse, a = vis * offFace(e[0], e[1]);
    if (a <= 0) return;
    const tg = g.createRadialGradient(e[0], e[1], 0, e[0], e[1], R);
    tg.addColorStop(0, rgba(hot, 0.95 * a)); tg.addColorStop(0.18, rgba(hot, 0.6 * a));
    tg.addColorStop(0.45, rgba(glow, 0.35 * a)); tg.addColorStop(1, rgba(glow, 0));
    g.fillStyle = tg; g.beginPath(); g.arc(e[0], e[1], R, 0, Math.PI * 2); g.fill();
  });
  // ---- spark streaks: a glow stroke in the accent, a white-hot core that cools as the spark ages ----
  g.lineCap = "round";
  for (const s of tipSparks(P, t)) {
    const fade = Math.pow(1 - s.life, 0.7) * vis * offFace(s.x, s.y);
    if (fade <= 0) continue;
    g.strokeStyle = rgba(glow, 0.5 * fade); g.lineWidth = s.size * 3.4;
    g.beginPath(); g.moveTo(s.tx, s.ty); g.lineTo(s.x, s.y); g.stroke();
    g.strokeStyle = rgba(s.life < 0.55 || s.hot > 0.6 ? hot : glow, 0.95 * fade); g.lineWidth = s.size;
    g.beginPath(); g.moveTo(s.tx, s.ty); g.lineTo(s.x, s.y); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
});
</script>
