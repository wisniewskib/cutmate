<style>
ROOT .fl { position: absolute; inset: 0; overflow: hidden; background: var(--panel-bg, #0b0b0f); font-family: var(--font); }
ROOT .fl-dots { position: absolute; inset: 0; opacity: 0.14;
  background-image: radial-gradient(circle, var(--pi, #ffffff) 1.4px, transparent 1.6px);
  background-size: calc(var(--s) * 38px) calc(var(--s) * 38px); }
ROOT .fl-glow { position: absolute; inset: -10%;
  background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--ac) 22%, transparent), transparent 60%); }
ROOT .fl-title { position: absolute; left: 0; right: 0; text-align: center; color: var(--pi, #ffffff); font-family: var(--font-display);
  font-synthesis: none; font-weight: 900;
  letter-spacing: -0.03em; line-height: 1.05; }
ROOT .fl-title .bar { display: block; margin: calc(var(--s) * 16px) auto 0; width: calc(var(--s) * 120px);
  height: calc(var(--s) * 10px); border-radius: calc(var(--s) * 5px); background: var(--ac); transform-origin: center; }
ROOT .fl.lp .fl-glow { display: none; }
ROOT svg.fl-svg { position: absolute; left: 0; top: 0; overflow: visible; }
ROOT .fl-node { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  text-align: center; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; padding: 0 calc(var(--s) * 26px); }
ROOT .fl.clean .fl-node { background: var(--card); color: var(--ink); border-radius: calc(var(--s) * var(--radius, 28px));
  box-shadow: 0 calc(var(--s) * 18px) calc(var(--s) * 50px) rgba(0, 0, 0, 0.5);
  border-bottom: calc(var(--s) * 8px) solid var(--ac); }
ROOT .fl.rough .fl-node { color: var(--pi, #ffffff); text-shadow: 0 0 calc(var(--s) * 10px) var(--panel-bg, #0b0b0f),
  0 0 calc(var(--s) * 4px) var(--panel-bg, #0b0b0f); }
ROOT .fl.lp.clean .fl-node { box-shadow: var(--shadow, 0 10px 30px rgba(0, 0, 0, 0.18)); }
ROOT .fl-badge { position: absolute; left: calc(var(--s) * -20px); top: calc(var(--s) * -20px);
  width: calc(var(--s) * 58px); height: calc(var(--s) * 58px); border-radius: 50%; background: var(--ac); color: var(--on-accent, var(--ink));
  font-weight: 900; font-size: calc(var(--s) * 30px); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 calc(var(--s) * 6px) var(--panel-bg, #0b0b0f); }
</style>
<markup><div class="fl"></div></markup>
<script>
const s = Math.min(P.w / 1000, P.h / 820);
const box = root.querySelector(".fl");
const rough = P.style === "rough";
box.classList.add(rough ? "rough" : "clean");
box.style.setProperty("--s", s);
if (P.accent) box.style.setProperty("--ac", P.accent);
else box.style.setProperty("--ac", "var(--accent)");
const accent = P.accent || getComputedStyle(root).getPropertyValue("--accent").trim() || "#7dd3fc";
const clamp = (v) => Math.min(1, Math.max(0, v));
const backOut = (u) => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);
const quartOut = (u) => 1 - Math.pow(1 - u, 4);
const inOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
// ink on the panel: the theme's --ink on a light --panel-bg, white on a dark one
const lightPanel = U.panelLight(box);
box.style.setProperty("--pi", lightPanel ? "var(--ink)" : "#ffffff");
if (lightPanel) box.classList.add("lp");
const inkPx = lightPanel ? getComputedStyle(root).getPropertyValue("--ink").trim() || "#0f172a" : "#ffffff";

const labels = (P.nodes || []).slice(0, 6).map(String);
const n = labels.length;
const valid = (e) => Array.isArray(e) && e.length === 2 && e.every((i) => Number.isInteger(i) && i >= 0 && i < n) && e[0] !== e[1];
let edges = Array.isArray(P.edges) ? P.edges.filter(valid) : [];
if (!Array.isArray(P.edges)) edges = labels.slice(1).map((_, i) => [i, i + 1]);

U.el("div", "fl-dots", null, box);
const glow = U.el("div", "fl-glow", null, box);

// layout: a snake grid, so sequential arrows always join neighbours
const pad = 52 * s;
let top = pad, title = null, bar = null;
if (P.title) {
  title = U.el("div", "fl-title", String(P.title), box);
  title.style.top = pad * 0.8 + "px";
  title.style.fontSize = Math.min(60 * s, (P.w - 2 * pad) / Math.max(6, String(P.title).length * 0.56)) + "px";
  title.style.padding = "0 " + pad + "px";
  bar = U.el("span", "bar", null, title);
  top = pad * 0.8 + 150 * s;
}
const wide = P.w >= P.h;
const cols = n <= 3 ? (wide ? Math.max(1, n) : 1) : 2;
const rows = Math.max(1, Math.ceil(n / cols));
const areaW = P.w - 2 * pad, areaH = P.h - top - pad;
const cellW = areaW / cols, cellH = areaH / rows;
const nw = Math.min(cellW - 96 * s, 620 * s), nh = Math.min(cellH - 64 * s, nw * 0.7, 230 * s);
const cell = labels.map((_, i) => {
  const r = Math.floor(i / cols), c0 = i % cols, c = r % 2 ? cols - 1 - c0 : c0;
  return { r, c, x: pad + (c + 0.5) * cellW, y: top + (r + 0.5) * cellH };
});

// a panel item (P.panel): every node and arrow is on screen by U.fullAt (min 0.5 s, 35 % of the span); the dots along
// the arrows run on after it. Classic split / side: the natural pace (nodes over ~72 % of the span)
const fast = !!P.panel;
const full = U.fullAt(P.at, P.end), F = full - P.at;
const span = Math.max(0.8, P.end - P.at);
const titleDur = fast ? Math.min(0.45, F * 0.6) : 0.45, popDur = fast ? Math.min(0.45, F * 0.4) : 0.45;
const barAt = fast ? titleDur * 0.3 : 0.15, barDur = fast ? titleDur * 0.7 : 0.5, drawDur = fast ? popDur : 0.6;
const t0 = P.at + (fast ? Math.min(title ? 0.15 : 0.05, F * 0.15) : (title ? 0.4 : 0.12));
const step = fast ? Math.max(0.001, full - popDur - t0) / Math.max(1, n - 1)
  : Math.min(0.75, Math.max(0.25, (span * 0.72 - 0.6) / Math.max(1, n - 1)));
const appear = (i) => t0 + i * step;

const NS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(NS, "svg");
svg.setAttribute("class", "fl-svg");
svg.setAttribute("width", P.w); svg.setAttribute("height", P.h);
svg.setAttribute("viewBox", "0 0 " + P.w + " " + P.h);
box.appendChild(svg);
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k]));
  (parent || svg).appendChild(e);
  return e;
};
const dashable = (paths) => paths.forEach((p) => {
  p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1"; p.style.strokeDashoffset = "1";
});
const drawTo = (paths, q) => paths.forEach((p) => { p.style.strokeDashoffset = String(1 - q); });

// node boxes (rough: hand-drawn rectangles under the text)
const fitFs = (txt) => {           // one size for every node: the size the hardest label fits at
  const longest = Math.max(4, ...txt.split(/\s+/).map((w) => w.length));
  return Math.min(54 * s, nh * 0.32, ((nw - 60 * s) * 2) / Math.max(4, txt.length * 0.6), (nw - 60 * s) / (longest * 0.64));
};
const fs = Math.min(...labels.map(fitFs), 54 * s);
const nodes = labels.map((txt, i) => {
  const { x, y } = cell[i];
  const el = U.el("div", "fl-node", null, box);
  Object.assign(el.style, { left: x - nw / 2 + "px", top: y - nh / 2 + "px", width: nw + "px", height: nh + "px" });
  el.style.fontSize = fs + "px";
  U.el("span", null, txt, el);
  U.el("div", "fl-badge", String(i + 1), el);
  let strokes = [];
  if (rough) {
    const g = mk("g", {});
    U.rough(g, [{ kind: "rectangle", args: [x - nw / 2, y - nh / 2, nw, nh],
                  opts: { stroke: inkPx, strokeWidth: 3.2 * s, roughness: 1.4, fill: accent, fillStyle: "hachure",
                          hachureGap: 16 * s, fillWeight: 2.2 * s, hachureAngle: -41 } }], { seed: (P.seed || 1) + i });
    strokes = Array.from(g.querySelectorAll("path"));
    dashable(strokes);
  }
  return { el, strokes };
});

// edges: border to border, curved when the two nodes are not grid neighbours
const hw = nw / 2 + 14 * s, hh = nh / 2 + 14 * s;
const exitPt = (c, dx, dy) => {
  const k = Math.min(dx ? hw / Math.abs(dx) : 1e9, dy ? hh / Math.abs(dy) : 1e9);
  return [c.x + dx * k, c.y + dy * k];
};
const arrows = edges.map(([a, b], j) => {
  const A = cell[a], B = cell[b];
  const near = Math.abs(A.r - B.r) + Math.abs(A.c - B.c) === 1;
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
  const bend = near ? 0 : 0.22 * len;
  const mx = (A.x + B.x) / 2 - (dy / len) * bend, my = (A.y + B.y) / 2 + (dx / len) * bend;
  const p1 = exitPt(A, mx - A.x, my - A.y), p2 = exitPt(B, mx - B.x, my - B.y);
  const d = near ? "M" + p1 + " L" + p2 : "M" + p1 + " Q" + mx + "," + my + " " + p2;
  const ex = p2[0] - (near ? p1[0] : mx), ey = p2[1] - (near ? p1[1] : my), el = Math.hypot(ex, ey) || 1;
  const ux = ex / el, uy = ey / el, hl = 26 * s;
  const w1 = [p2[0] - ux * hl - uy * hl * 0.7, p2[1] - uy * hl + ux * hl * 0.7];
  const w2 = [p2[0] - ux * hl + uy * hl * 0.7, p2[1] - uy * hl - ux * hl * 0.7];
  let line, head, path = null;
  if (rough) {
    const g = mk("g", {}), hg = mk("g", {});
    U.rough(g, [{ kind: "path", args: [d], opts: { stroke: accent, strokeWidth: 5 * s, roughness: 1.2 } }], { seed: (P.seed || 1) + 40 + j });
    U.rough(hg, [{ kind: "path", args: ["M" + w1 + " L" + p2 + " L" + w2], opts: { stroke: accent, strokeWidth: 5 * s, roughness: 0.8 } }],
            { seed: (P.seed || 1) + 80 + j });
    line = Array.from(g.querySelectorAll("path")); head = hg;
  } else {
    path = mk("path", { d, fill: "none", stroke: accent, "stroke-width": 7 * s, "stroke-linecap": "round" });
    line = [path];
    head = mk("path", { d: "M" + w1 + " L" + p2 + " L" + w2, fill: "none", stroke: accent, "stroke-width": 7 * s,
                        "stroke-linecap": "round", "stroke-linejoin": "round" });
  }
  dashable(line);
  head.style.opacity = 0;
  const start = appear(Math.max(a, b)) - 0.62 * step, dur = 0.55 * step;
  const dot = path ? mk("circle", { r: 9 * s, fill: inkPx }) : null;
  if (dot) dot.style.opacity = 0;
  return { line, head, path, dot, start, dur };
});

U.clock((t) => {
  const vis = clamp((t - P.at) / 0.25) * clamp((P.end - t) / 0.25);
  box.style.opacity = vis;
  box.style.visibility = vis > 0 ? "visible" : "hidden";
  if (!vis) return;
  glow.style.transform = "scale(" + (0.92 + 0.08 * clamp((t - P.at) / 0.8)) + ")";
  if (title) {
    const q = clamp((t - P.at) / titleDur);
    title.style.opacity = clamp(q * 2);
    title.style.transform = "translateY(" + ((1 - quartOut(q)) * -30 * s) + "px)";
    bar.style.transform = "scaleX(" + quartOut(clamp((t - P.at - barAt) / barDur)) + ")";
  }
  nodes.forEach((nd, i) => {
    const q = clamp((t - appear(i)) / popDur);
    nd.el.style.opacity = clamp(q * 2.5);
    nd.el.style.transform = "translateY(" + ((1 - quartOut(q)) * 36 * s) + "px) scale(" + (0.72 + 0.28 * backOut(q)) + ")";
    if (nd.strokes.length) drawTo(nd.strokes, inOut(clamp((t - appear(i)) / drawDur)));
  });
  arrows.forEach((ar) => {
    const q = inOut(clamp((t - ar.start) / ar.dur));
    drawTo(ar.line, q);
    ar.head.style.opacity = clamp((q - 0.82) / 0.18);
    if (ar.dot) {
      const k = t - ar.start - ar.dur;
      const L = ar.path.getTotalLength();
      const f = ((k * 0.9) % 1 + 1) % 1;
      const pt = ar.path.getPointAtLength(f * L);
      ar.dot.setAttribute("cx", pt.x); ar.dot.setAttribute("cy", pt.y);
      ar.dot.style.opacity = k > 0 ? clamp(k / 0.3) * Math.sin(Math.PI * f) : 0;
    }
  });
});
</script>
