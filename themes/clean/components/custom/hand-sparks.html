<style>
ROOT .fx-hs { position: absolute; inset: 0; }
ROOT .fx-hs canvas { position: absolute; left: 0; top: 0; }
</style>
<markup><div class="fx-hs"></div></markup>
<script>
// Energy pouring out of the speaker's hands: a glow on each palm and a stream of particles leaving it.
// mode "stream" (default): soft motes flow outward and up, away from the body (spread hands, "look at this").
// mode "sparks": hot streak sparks fly off and fall with gravity (a trick, a fast move, a stick twirl).
// link: true draws a flickering energy arc between the two hands while both are in view.
// Hands: P.hands (both palms, from "place": "gesture") else P.track ("follow" / the placed palm) else P.place / x,y.
// Every particle is a pure function of t (birth slot + seeded randomness), so any frame renders the same.
const box = root.querySelector(".fx-hs");
const cv = document.createElement("canvas"); cv.width = P.w; cv.height = P.h; box.appendChild(cv);
const g = cv.getContext("2d");
const mode = P.mode === "sparks" ? "sparks" : "stream";
const cols = P.colors && P.colors.length ? P.colors : (mode === "sparks" ? ["#ffffff", "#fde68a", "#fb923c"] : ["#ffffff", "#a5f3fc", "#818cf8"]);
const hands = P.hands ? Object.values(P.hands).filter((h) => h && h.length) : (P.track && P.track.length ? [P.track] : []);
const fixed = P.place || (P.x != null && P.y != null ? [P.x, P.y] : [P.w / 2, P.h / 2]);
const K = Math.max(0.3, P.size || 1);                       // overall scale
const N = Math.round((mode === "sparks" ? 110 : 90) * Math.min(2, K));
const LIFE = mode === "sparks" ? 0.7 : 1.1;
const GLOW = P.h * 0.085 * K;
const at = (h, t) => (h ? U.trackAt(h, t) : fixed);
const emitters = hands.length ? hands : [null];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`; };
const clamp = (v) => Math.min(1, Math.max(0, v));
// the body centre (between the hands, or below the frame centre) — streams leave away from it
const centre = (t) => {
  const ps = emitters.map((h) => at(h, t)).filter(Boolean);
  if (ps.length >= 2) return [(ps[0][0] + ps[1][0]) / 2, Math.max(ps[0][1], ps[1][1]) + P.h * 0.1];
  return [P.w / 2, P.h * 0.75];
};
function particle(k, i, t, h) {
  const slot = (t - P.at) / LIFE - i / N;
  const cyc = Math.floor(slot), age = (slot - cyc) * LIFE, born = t - age;
  if (born < P.at || born > P.end - 0.25) return null;
  const e = at(h, born);
  if (!e) return null;
  const r = U.seed(1 + k * 7919 + i * 104729 + (cyc + 1000) * 15485863);
  const c = centre(born);
  let base = Math.atan2(e[1] - c[1], e[0] - c[0]);
  const spread = mode === "sparks" ? Math.PI * 1.1 : 1.1;
  const ang = base + (r() - 0.5) * spread;
  const v = P.h * K * (mode === "sparks" ? 0.9 + r() * 1.3 : 0.25 + r() * 0.45);
  const drag = mode === "sparks" ? 2.4 : 1.2, grav = mode === "sparks" ? P.h * 1.1 : -P.h * 0.12;
  const pos = (a) => { const d = (v / drag) * (1 - Math.exp(-drag * a));
                       return [e[0] + Math.cos(ang) * d + (r0 - 0.5) * 6, e[1] + Math.sin(ang) * d + 0.5 * grav * a * a]; };
  const r0 = r();
  return { pos, age, life: age / LIFE, size: (mode === "sparks" ? 2.2 : 3.2) * K * (0.6 + r() * 0.9), col: cols[1 + Math.floor(r() * (cols.length - 1))] || cols[0], tw: r() * 6.28 };
}
U.clock((t) => {
  g.clearRect(0, 0, P.w, P.h);
  const vis = clamp((t - P.at) / 0.2) * clamp((P.end - t) / 0.3);
  if (vis <= 0) return;
  g.globalCompositeOperation = "lighter";
  g.lineCap = "round";
  emitters.forEach((h, k) => {
    const p = at(h, t);
    if (p) {                                                   // palm glow
      const pulse = 1 + 0.12 * Math.sin(t * 9 + k);
      const gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], GLOW * 1.6 * pulse);
      gr.addColorStop(0, rgba(cols[0], 0.85 * vis)); gr.addColorStop(0.25, rgba(cols[1 % cols.length], 0.45 * vis));
      gr.addColorStop(1, rgba(cols[(cols.length - 1)], 0));
      g.fillStyle = gr; g.beginPath(); g.arc(p[0], p[1], GLOW * 1.6 * pulse, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < N; i++) {
      const q = particle(k, i, t, h);
      if (!q) continue;
      const fade = Math.pow(1 - q.life, mode === "sparks" ? 0.8 : 1.3) * vis;
      const a1 = q.pos(q.age), a0 = q.pos(Math.max(0, q.age - (mode === "sparks" ? 0.07 : 0.12)));
      g.strokeStyle = rgba(q.col, 0.35 * fade); g.lineWidth = q.size * 3.2;
      g.beginPath(); g.moveTo(a0[0], a0[1]); g.lineTo(a1[0], a1[1]); g.stroke();
      g.strokeStyle = rgba(cols[0], (mode === "sparks" ? 0.95 : 0.8) * fade * (0.75 + 0.25 * Math.sin(q.tw + t * 20)));
      g.lineWidth = q.size;
      g.beginPath(); g.moveTo(a0[0], a0[1]); g.lineTo(a1[0], a1[1]); g.stroke();
    }
  });
  if (P.link && emitters.length >= 2) {                         // energy arc between the hands
    const a = at(emitters[0], t), b = at(emitters[1], t);
    if (a && b && Math.hypot(b[0] - a[0], b[1] - a[1]) < P.w * 0.6) {
      const r = U.seed(77 + Math.floor(t * 24));               // re-jag 24x a second
      const n = 14, pts = [];
      const nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
      for (let j = 0; j <= n; j++) {
        const f = j / n, amp = Math.sin(f * Math.PI) * P.h * 0.035 * K;
        const o = (r() - 0.5) * 2 * amp;
        pts.push([a[0] + (b[0] - a[0]) * f + nx / nl * o, a[1] + (b[1] - a[1]) * f + ny / nl * o]);
      }
      [[10, 0.25, 1], [4, 0.6, 1], [1.6, 1, 0]].forEach(([w, al, ci]) => {
        g.strokeStyle = rgba(cols[ci % cols.length] || cols[0], al * vis); g.lineWidth = w * K;
        g.beginPath(); pts.forEach((p, j) => (j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
      });
    }
  }
  g.globalCompositeOperation = "source-over";
});
</script>
