<style>
ROOT .fx-burst { position: absolute; inset: 0; }
</style>
<markup><div class="fx-burst"></div></markup>
<script>
// One-shot impact: white flash, two shockwave rings, streak sparks flying out with drag and gravity, falling embers.
// Placed at P.place (gesture), else params x / y (px), else the frame centre. Plays 0.6-1.0 s from P.at.
const box = root.querySelector(".fx-burst");
const cols = (P.colors && P.colors.length ? P.colors : ["#ffffff", "#fde68a", "#fb923c"]);
const LEN = Math.max(0.6, Math.min(1.0, P.end - P.at));
const xy = P.place || (P.x != null && P.y != null ? [P.x, P.y] : [P.w / 2, P.h / 2]);
U.three({ el: box, bloom: { strength: 0.8, radius: 0.5, threshold: 0.25 } }).then((S) => {
  const { THREE } = S;
  const UPX = 6.3 / P.h;                                    // world units per px (camera z 10, fov 35)
  const R = (P.size || 1) * 0.2 * Math.min(P.w, P.h) * UPX; // burst reach
  const C = cols.map((c) => new THREE.Color(c));
  const cCore = C[0], cSpark = C[1 % C.length], cRing = C[2 % C.length];
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const tex = (draw, w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h || w; draw(c.getContext("2d"), w, h || w);
                                const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
  const radial = tex((g, w) => { const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,0.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, w); }, 128);
  const streak = tex((g, w, h) => { const gx = g.createLinearGradient(0, 0, w, 0);   // tail (left) -> hot head (right)
    gx.addColorStop(0, "rgba(255,255,255,0)"); gx.addColorStop(0.8, "rgba(255,255,255,0.75)"); gx.addColorStop(1, "rgba(255,255,255,1)");
    g.fillStyle = gx; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "destination-in"; const gy = g.createLinearGradient(0, 0, 0, h);
    gy.addColorStop(0, "rgba(0,0,0,0)"); gy.addColorStop(0.5, "rgba(0,0,0,1)"); gy.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gy; g.fillRect(0, 0, w, h); }, 128, 16);
  const group = new THREE.Group(); group.position.copy(S.toWorld(xy[0], xy[1])); S.scene.add(group);
  const add = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };

  const flash = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial(Object.assign({ map: radial, color: cCore }, add)));
  group.add(flash);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial(Object.assign({ map: radial, color: cRing }, add)));
  group.add(glow);

  const ringMat = () => new THREE.ShaderMaterial(Object.assign({
    uniforms: { uR: { value: 0 }, uW: { value: 0.05 }, uA: { value: 0 }, uC: { value: cRing.clone() } },
    vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader: "uniform float uR; uniform float uW; uniform float uA; uniform vec3 uC; varying vec2 vUv;"
      + " void main(){ float d=length(vUv-0.5)*2.0; float k=exp(-pow((d-uR)/uW,2.0)); float inner=smoothstep(uR,0.0,d)*0.06*step(d,uR);"
      + " vec3 c=mix(uC, vec3(1.0), k*0.6); gl_FragColor=vec4(c*(k+inner)*uA, 1.0); }",
  }, add));
  const rings = [0, 1].map(() => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), ringMat()); group.add(m); return m; });

  const rnd = U.seed(P.seed || 11);
  const N = 54;
  const sparks = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial(Object.assign({ map: streak }, add)), N);
  sparks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const sp = Array.from({ length: N }, () => ({ a: rnd() * Math.PI * 2, v: R * (3.0 + rnd() * 4.5), k: 3.0 + rnd() * 2.0,
                                                life: LEN * (0.45 + rnd() * 0.5), w: 0.6 + rnd() * 0.8, hot: rnd() }));
  for (let i = 0; i < N; i++) sparks.setColorAt(i, cCore);
  group.add(sparks);
  const NE = 36, epos = new Float32Array(NE * 3), ecol = new Float32Array(NE * 3);
  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute("position", new THREE.BufferAttribute(epos, 3)); egeo.setAttribute("color", new THREE.BufferAttribute(ecol, 3));
  const embers = new THREE.Points(egeo, new THREE.PointsMaterial(Object.assign({ map: radial, size: R * 0.06, vertexColors: true }, add)));
  const em = Array.from({ length: NE }, () => ({ a: rnd() * Math.PI * 2, v: R * (0.6 + rnd() * 1.6), d: 0.05 + rnd() * 0.2, f: 8 + rnd() * 14, ph: rnd() * 6 }));
  group.add(embers);

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), Z = new THREE.Vector3(0, 0, 1), v3 = new THREE.Vector3(), s3 = new THREE.Vector3();
  const col = new THREE.Color(), out3 = (x) => 1 - Math.pow(1 - x, 3);
  U.clock((t) => {
    const a = t - P.at;
    group.visible = a >= 0 && a <= LEN;
    if (group.visible) {
      const f = clamp(a / 0.16);                              // flash: pops then dies in ~0.25 s
      flash.scale.setScalar(R * (0.3 + 0.8 * out3(f)));
      flash.material.opacity = (a < 0.04 ? a / 0.04 : 1) * Math.pow(1 - clamp(a / 0.22), 2) * 0.95;
      glow.scale.setScalar(R * 2.6);
      glow.material.opacity = 0.12 * Math.pow(1 - clamp(a / (LEN * 0.6)), 2);
      rings.forEach((m, i) => {
        const r0 = clamp((a - i * 0.07) / (LEN * (0.55 + i * 0.15)));
        m.scale.setScalar(R * (i ? 3.4 : 2.8));
        m.material.uniforms.uR.value = 0.08 + 0.9 * out3(r0);
        m.material.uniforms.uW.value = (i ? 0.008 : 0.016) * (1 + 1.5 * r0);
        m.material.uniforms.uA.value = a < i * 0.07 ? 0 : (i ? 0.55 : 0.85) * Math.pow(1 - r0, 1.4);
      });
      sp.forEach((s, i) => {
        const age = a, k = s.k, g = R * 1.6;
        const life = clamp(age / s.life);
        const d = (s.v / k) * (1 - Math.exp(-k * age)), vel = s.v * Math.exp(-k * age);
        const x = Math.cos(s.a) * d, y = Math.sin(s.a) * d - 0.5 * g * age * age;
        const vx = Math.cos(s.a) * vel, vy = Math.sin(s.a) * vel - g * age;
        const len = Math.max(R * 0.06, Math.hypot(vx, vy) * 0.11), ang = Math.atan2(vy, vx);
        q.setFromAxisAngle(Z, ang);
        v3.set(x - Math.cos(ang) * len / 2, y - Math.sin(ang) * len / 2, 0);
        s3.set(life >= 1 ? 0.0001 : len, R * 0.045 * s.w, 1);
        m4.compose(v3, q, s3); sparks.setMatrixAt(i, m4);
        const fade = Math.pow(1 - life, 1.4);
        col.copy(cCore).lerp(cSpark, clamp(life * 1.6 + s.hot * 0.3)).multiplyScalar(fade * 1.1);
        sparks.setColorAt(i, col);
      });
      sparks.instanceMatrix.needsUpdate = true; if (sparks.instanceColor) sparks.instanceColor.needsUpdate = true;
      em.forEach((e, i) => {
        const age = Math.max(0, a - e.d), d = e.v * out3(clamp(age / 0.5)) ;
        epos[i * 3] = Math.cos(e.a) * d; epos[i * 3 + 1] = Math.sin(e.a) * d - R * 0.9 * age * age; epos[i * 3 + 2] = 0;
        const life = clamp(age / (LEN - e.d)), tw = 0.6 + 0.4 * Math.sin(e.ph + age * e.f);
        col.copy(cSpark).lerp(cRing, life).multiplyScalar(a < e.d ? 0 : (1 - life) * tw);
        ecol[i * 3] = col.r; ecol[i * 3 + 1] = col.g; ecol[i * 3 + 2] = col.b;
      });
      egeo.attributes.position.needsUpdate = true; egeo.attributes.color.needsUpdate = true;
    }
    S.render();
  });
});
</script>
