<style>
ROOT .sc { position: absolute; inset: 0; overflow: hidden; background: var(--panel-bg, #0b0b0f); font-family: var(--font);
  display: flex; align-items: center; justify-content: center; }
ROOT .sc-bg { position: absolute; inset: -4%; background-size: cover; background-position: center;
  filter: brightness(0.45) saturate(0.9) blur(14px); }
ROOT .sc-shot { position: absolute; box-sizing: border-box; overflow: hidden; background-color: var(--panel-bg, #0b0b0f);
  background-size: cover; background-position: center top; border: 2px solid rgba(255, 255, 255, 0.16);
  border-radius: calc(var(--s) * var(--radius, 28px)); box-shadow: 0 calc(var(--s) * 24px) calc(var(--s) * 70px) rgba(0, 0, 0, 0.6); }
ROOT .has-media { align-items: flex-end; }
ROOT .has-media .sc-dots { display: none; }
ROOT .sc-dots { position: absolute; inset: 0; opacity: 0.16;
  background-image: radial-gradient(circle, var(--pi, #ffffff) 1.4px, transparent 1.6px);
  background-size: calc(var(--s) * 38px) calc(var(--s) * 38px); }
ROOT .sc-glow { position: absolute; inset: -20%;
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--ac) 34%, transparent), transparent 58%); }
ROOT .sc-card { position: relative; box-sizing: border-box; background: var(--card); color: var(--ink);
  border-radius: calc(var(--s) * var(--radius, 28px) * 11 / 7); padding: calc(var(--s) * 60px) calc(var(--s) * 64px) calc(var(--s) * 56px);
  box-shadow: 0 calc(var(--s) * 30px) calc(var(--s) * 80px) rgba(0, 0, 0, 0.55); overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
ROOT .sc-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--s) * 14px); background: var(--ac); }
ROOT .sc-num { position: relative; display: inline-block; font-family: var(--font-num, var(--font-display)); font-synthesis: none; font-weight: 900; line-height: 0.92; letter-spacing: -0.045em;
  white-space: nowrap; font-feature-settings: "tnum" 1; }
ROOT .sc-num .hl { position: absolute; left: -0.04em; right: -0.04em; bottom: 0.04em; height: 0.3em; background: var(--ac);
  transform-origin: left center; z-index: 0; border-radius: 0.04em; }
ROOT .sc-num .tx { position: relative; z-index: 1; }
ROOT .sc-num .aff { font-size: 0.56em; font-weight: 800; letter-spacing: -0.02em; }
ROOT .sc-label { margin-top: calc(var(--s) * 34px); font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; }
ROOT .sc-label span { display: inline-block; margin-right: 0.24em; }
/* hero: the number fills the panel (display font, accent), no card, the label under it */
ROOT .sc.hero { flex-direction: column; }
ROOT .sc.hero .sc-card { background: none; box-shadow: none; overflow: visible; align-items: center; text-align: center;
  padding: 0; min-height: 0; }
ROOT .sc.hero .sc-card::before { display: none; }
ROOT .sc.hero .sc-num { color: var(--ac); line-height: 0.9; }
ROOT .sc.hero .sc-num .hl { display: none; }
ROOT .sc.hero .sc-label { color: var(--pi, #ffffff); text-align: center; }
ROOT .sc.hero .sc-note { color: var(--pi, #ffffff); opacity: 0.6; }
ROOT .sc.lp .sc-glow { display: none; }
ROOT .sc.lp:not(.hero) .sc-card, ROOT .sc.lp .sc-shot { box-shadow: var(--shadow, 0 10px 30px rgba(0, 0, 0, 0.18)); }
ROOT .sc-note { margin-top: calc(var(--s) * 22px); font-weight: 500; color: var(--muted); line-height: 1.3;
  font-size: calc(var(--s) * 34px); }
</style>
<markup><div class="sc"></div></markup>
<script>
const s = Math.min(P.w / 1000, P.h / 820);
const box = root.querySelector(".sc");
box.style.setProperty("--s", s);
box.style.setProperty("--ac", P.accent || "var(--accent)");
const clamp = (v) => Math.min(1, Math.max(0, v));
const backOut = (u) => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);
const quartOut = (u) => 1 - Math.pow(1 - u, 4);
const hero = P.layout === "hero";
if (hero) box.classList.add("hero");
// ink on the panel: the theme's --ink on a light --panel-bg, white on a dark one
const lightPanel = U.panelLight(box);
box.style.setProperty("--pi", lightPanel ? "var(--ink)" : "#ffffff");
if (lightPanel) box.classList.add("lp");

// with media: a blurred ambient copy fills the panel, the screenshot itself sits framed and undimmed in the top part,
// and a compact card overlaps its lower edge (the number stays on solid white, the screenshot stays readable)
let bg = null, shot = null;
if (P.media) {
  box.classList.add("has-media");
  bg = U.el("div", "sc-bg", null, box);
  bg.style.backgroundImage = "url('" + P.media + "')";
}
U.el("div", "sc-dots", null, box);
const glow = U.el("div", "sc-glow", null, box);
if (P.media && !hero) {
  shot = U.el("div", "sc-shot", null, box);
  const m = 40 * s;
  Object.assign(shot.style, { left: m + "px", top: m + "px", width: P.w - 2 * m + "px", height: P.h * 0.6 + "px",
                              backgroundImage: "url('" + P.media + "')" });
}
const card = U.el("div", "sc-card", null, box);
const cardW = hero ? P.w - 2 * 56 * s : Math.min(P.w - 2 * 56 * s, (P.media ? 820 : 900) * s);
card.style.width = cardW + "px";
if (hero) box.classList.remove("has-media");
else if (P.media) card.style.marginBottom = 40 * s + "px";
else card.style.minHeight = Math.min(P.h - 2 * 56 * s, P.h * 0.74) + "px";
const inner = hero ? cardW : cardW - 2 * 64 * s;

const value = Number(P.value) || 0;
const dec = (String(P.value).split(".")[1] || "").length;
const pl = P.lang === "pl";
const fmt = (v) => {
  const fixed = Math.abs(v).toFixed(dec);
  const [i, f] = fixed.split(".");
  return (v < 0 && Number(fixed) !== 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, pl ? " " : ",")
    + (f ? (pl ? "," : ".") + f : "");
};
const pre = P.prefix ? String(P.prefix) : "", suf = P.suffix ? String(P.suffix) : "";
const num = U.el("div", "sc-num", null, card);
const hl = U.el("span", "hl", null, num);
const tx = U.el("span", "tx", null, num);
if (pre) U.el("span", "aff", pre, tx);
const digits = U.el("span", null, fmt(0), tx);
if (suf) U.el("span", "aff", suf, tx);
const units = fmt(value).length * 0.62 + (pre.length + suf.length) * 0.62 * 0.56;
num.style.fontSize = Math.min((P.media ? 220 : 300) * s, inner / Math.max(1, units)) + "px";

const label = U.el("div", "sc-label", null, card);
label.style.fontSize = Math.min(70 * s, inner / Math.max(8, String(P.label || "").length * 0.36)) + "px";
const words = String(P.label || "").split(/\s+/).filter(Boolean).map((w) => U.el("span", null, w, label));
const note = P.note ? U.el("div", "sc-note", String(P.note), card) : null;
// hero: the number as big as the panel allows, measured at its final value once the display font has loaded
const fitHero = () => {
  if (!hero) return;
  const room = P.h - 2 * 56 * s - (words.length ? 150 * s : 0) - (note ? 70 * s : 0);
  let fs = Math.min(room / 0.9, 560 * s);
  digits.textContent = fmt(value);
  num.style.fontSize = fs + "px";
  const wNow = num.offsetWidth;
  if (wNow > inner) num.style.fontSize = (fs = fs * inner / wNow) + "px";
  digits.textContent = fmt(0);
};
fitHero();
const dispFam = getComputedStyle(document.documentElement).getPropertyValue("--font-display").trim();
U.ready(Promise.all([U.fonts([800, 900]), U.fonts([400, 700, 900], dispFam), U.fonts([400, 700, 900], U.numFamily())]).then(fitHero));

const span = Math.max(0.6, P.end - P.at);
// card, label and note are readable by U.fullAt (min 0.5 s, 35 % of the span); the count-up may run on after it
const full = U.fullAt(P.at, P.end), F = full - P.at;
const cardDur = Math.min(0.55, F);
const tCount = P.at + Math.min(0.3, F * 0.25), dCount = Math.min(1.5, Math.max(0.5, span * 0.45));
const wDur = Math.min(0.4, F * 0.45), nDur = Math.min(0.45, F * 0.45);
const tLabel = P.at + Math.min(0.45, F * 0.2);
const wStep = Math.min(0.07, Math.max(0, full - wDur - tLabel) / Math.max(1, words.length - 1));
const tNote = Math.min(tLabel + 0.25 + words.length * 0.07, full - nDur);

U.clock((t) => {
  const vis = clamp((t - P.at) / 0.25) * clamp((P.end - t) / 0.25);
  box.style.opacity = vis;
  box.style.visibility = vis > 0 ? "visible" : "hidden";
  if (!vis) return;
  const k = t - P.at;
  if (bg) bg.style.transform = "scale(" + (1.08 + 0.07 * clamp(k / span)) + ")";
  if (shot) {
    const v = quartOut(clamp(k / 0.5));
    shot.style.opacity = v;
    shot.style.transform = "translateY(" + ((1 - v) * -30 * s) + "px) scale(" + (0.96 + 0.04 * v + 0.03 * clamp(k / span)) + ")";
  }
  glow.style.transform = "scale(" + (0.9 + 0.1 * clamp(k / 0.8)) + ") rotate(" + (k * 6) + "deg)";
  const u = clamp(k / cardDur);
  card.style.opacity = clamp(u * 2.5);
  card.style.transform = "translateY(" + ((1 - backOut(u)) * (hero ? 40 : 90) * s) + "px) scale(" + ((hero ? 0.8 : 0.9) + (hero ? 0.2 : 0.1) * backOut(u)) + ")";
  const c = quartOut(clamp((t - tCount) / dCount));
  digits.textContent = fmt(c >= 1 ? value : value * c);
  hl.style.transform = "scaleX(" + quartOut(clamp((t - tCount - dCount * 0.35) / 0.5)) + ")";
  words.forEach((w, i) => {
    const q = clamp((t - tLabel - i * wStep) / wDur);
    w.style.opacity = clamp(q * 2);
    w.style.transform = "translateY(" + ((1 - quartOut(q)) * 40 * s) + "px)";
  });
  if (note) {
    const q = clamp((t - tNote) / nDur);
    note.style.opacity = q;
    note.style.transform = "translateY(" + ((1 - quartOut(q)) * 20 * s) + "px)";
  }
});
</script>
