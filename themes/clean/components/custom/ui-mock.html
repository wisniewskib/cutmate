<style>
ROOT .um { position: absolute; inset: 0; overflow: hidden; background: #0b0b0f; font-family: var(--font); }
ROOT .um-glow { position: absolute; inset: -10%;
  background: radial-gradient(ellipse at 50% 20%, color-mix(in srgb, var(--ac) 24%, transparent), transparent 60%); }
ROOT .um-win { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
  border-radius: calc(var(--s) * 40px); box-shadow: 0 calc(var(--s) * 30px) calc(var(--s) * 80px) rgba(0, 0, 0, 0.6); }
ROOT .um-head { flex: none; display: flex; align-items: center; gap: calc(var(--s) * 20px);
  padding: calc(var(--s) * 26px) calc(var(--s) * 34px); }
ROOT .um-body { position: relative; flex: 1; overflow: hidden; }
ROOT .um-feed { position: absolute; left: 0; right: 0; top: 0; box-sizing: border-box; display: flex; flex-direction: column; }
ROOT .um-caret { display: inline-block; width: 0.09em; height: 1.05em; margin-left: 0.06em; vertical-align: -0.17em;
  background: currentColor; border-radius: 0.04em; }
ROOT .um-av { flex: none; width: calc(var(--s) * 68px); height: calc(var(--s) * 68px); border-radius: 50%; background: var(--ac);
  color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--s) * 32px); }

/* chat */
ROOT .k-chat .um-win { background: var(--card); color: var(--ink); }
ROOT .k-chat .um-head { border-bottom: 1px solid rgba(15, 23, 42, 0.08); }
ROOT .k-chat .um-name { font-weight: 800; font-size: calc(var(--s) * 36px); letter-spacing: -0.02em; line-height: 1.1; }
ROOT .k-chat .um-sub { font-weight: 500; font-size: calc(var(--s) * 24px); color: var(--muted); }
ROOT .k-chat .um-sub::before { content: ""; display: inline-block; width: 0.5em; height: 0.5em; border-radius: 50%;
  background: #22c55e; margin-right: 0.4em; vertical-align: 0.05em; }
ROOT .k-chat .um-feed { padding: calc(var(--s) * 30px) calc(var(--s) * 30px); gap: calc(var(--s) * 22px); }
ROOT .k-chat .msg { max-width: 80%; box-sizing: border-box; padding: calc(var(--s) * 22px) calc(var(--s) * 30px);
  border-radius: calc(var(--s) * 34px); font-weight: 500; font-size: calc(var(--s) * 42px); line-height: 1.3;
  transform-origin: left bottom; white-space: pre-wrap; overflow-wrap: anywhere; }
ROOT .k-chat .msg.user { align-self: flex-end; background: var(--ac); color: var(--ink); border-bottom-right-radius: calc(var(--s) * 8px);
  transform-origin: right bottom; font-weight: 800; }
ROOT .k-chat .msg.ai, ROOT .k-chat .msg.cmd { align-self: flex-start; background: #eef2f7; color: var(--ink);
  border-bottom-left-radius: calc(var(--s) * 8px); }
ROOT .k-chat .dots { display: inline-flex; gap: 0.28em; padding: 0.2em 0; }
ROOT .k-chat .dots i { width: 0.36em; height: 0.36em; border-radius: 50%; background: #94a3b8; display: block; }

/* terminal */
ROOT .k-terminal .um-win { background: #0d1117; color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1); }
ROOT .k-terminal .um-head { background: #161b22; padding: calc(var(--s) * 22px) calc(var(--s) * 28px); gap: calc(var(--s) * 14px); }
ROOT .k-terminal .light { width: calc(var(--s) * 24px); height: calc(var(--s) * 24px); border-radius: 50%; flex: none; }
ROOT .k-terminal .um-name { flex: 1; text-align: center; margin-right: calc(var(--s) * 100px); color: #8b949e;
  font-weight: 500; font-size: calc(var(--s) * 26px); }
ROOT .k-terminal .um-feed { padding: calc(var(--s) * 32px) calc(var(--s) * 36px); gap: calc(var(--s) * 14px);
  font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: calc(var(--s) * 34px); line-height: 1.4; }
ROOT .k-terminal .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
ROOT .k-terminal .msg.cmd, ROOT .k-terminal .msg.user { color: #ffffff; font-weight: 700; }
ROOT .k-terminal .msg.ai { color: #9aa7b8; }
ROOT .k-terminal .ps { color: var(--ac); font-weight: 700; margin-right: 0.6em; }

/* post */
ROOT .k-post .um-win { background: var(--card); color: var(--ink); }
ROOT .k-post .um-head { padding: calc(var(--s) * 40px) calc(var(--s) * 44px) calc(var(--s) * 10px); }
ROOT .k-post .um-name { font-weight: 800; font-size: calc(var(--s) * 36px); letter-spacing: -0.02em; }
ROOT .k-post .um-sub { font-weight: 500; font-size: calc(var(--s) * 28px); color: var(--muted); }
ROOT .k-post .um-feed { padding: calc(var(--s) * 20px) calc(var(--s) * 44px); gap: calc(var(--s) * 26px); }
ROOT .k-post .msg { font-weight: 500; font-size: calc(var(--s) * 50px); line-height: 1.3; letter-spacing: -0.01em;
  white-space: pre-wrap; overflow-wrap: anywhere; }
ROOT .k-post .msg:first-child { font-weight: 800; }
ROOT .k-post .um-foot { flex: none; display: flex; gap: calc(var(--s) * 56px); padding: calc(var(--s) * 26px) calc(var(--s) * 44px) calc(var(--s) * 40px);
  border-top: 1px solid rgba(15, 23, 42, 0.08); color: var(--muted); font-weight: 800; font-size: calc(var(--s) * 30px); }
ROOT .k-post .act { display: flex; align-items: center; gap: 0.4em; }
ROOT .k-post .act svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
ROOT .k-post .act.like svg path { fill: var(--like-fill, none); stroke: var(--like-stroke, currentColor); }
</style>
<markup><div class="um"></div></markup>
<script>
const s = Math.min(P.w / 1000, P.h / 820);
const kind = ["chat", "terminal", "post"].includes(P.kind) ? P.kind : "chat";
const box = root.querySelector(".um");
box.classList.add("k-" + kind);
box.style.setProperty("--s", s);
box.style.setProperty("--ac", P.accent || "var(--accent)");
const clamp = (v) => Math.min(1, Math.max(0, v));
const backOut = (u) => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);
const quartOut = (u) => 1 - Math.pow(1 - u, 4);
const pl = P.lang === "pl";

U.el("div", "um-glow", null, box);
const pad = 40 * s;
const win = U.el("div", "um-win", null, box);
Object.assign(win.style, { left: pad + "px", top: pad + "px", width: P.w - 2 * pad + "px", height: P.h - 2 * pad + "px" });
const head = U.el("div", "um-head", null, win);
const titleText = String(P.title || (kind === "terminal" ? "zsh" : kind === "post" ? "cutmate" : "AI"));
if (kind === "terminal") {
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c) => { U.el("span", "light", null, head).style.background = c; });
  U.el("div", "um-name", titleText, head);
} else {
  U.el("div", "um-av", titleText.trim().charAt(0).toUpperCase() || "A", head);
  const who = U.el("div", null, null, head);
  U.el("div", "um-name", titleText, who);
  const handle = "@" + (titleText.toLowerCase().replace(/[^a-z0-9]+/g, "") || "user");
  U.el("div", "um-sub", kind === "post" ? handle : "online", who);
}
const body = U.el("div", "um-body", null, win);
const feed = U.el("div", "um-feed", null, body);

// lines: typed (chat / post / terminal commands) or printed fast (terminal output)
const raw = (P.lines || []).map((l) => (typeof l === "string" ? { who: "ai", text: l } : l))
  .map((l) => ({ who: ["user", "ai", "cmd"].includes(l.who) ? l.who : "ai", text: String(l.text == null ? "" : l.text) }));
const typed = (l) => !(kind === "terminal" && l.who === "ai");
const span = Math.max(0.8, P.end - P.at);
const think = kind === "chat" ? 0.5 : 0;
const gap = kind === "post" ? 0.18 : 0.3;
const thinks = raw.filter((l) => kind === "chat" && l.who === "ai").length;
const chars = raw.reduce((a, l) => a + (typed(l) ? Array.from(l.text).length : Array.from(l.text).length / 5), 0);
const avail = Math.max(0.4, span * 0.78 - 0.45 - raw.length * gap - thinks * think);
const cps = Math.min(90, Math.max(16, chars / avail));
let cur = P.at + 0.45;
const lines = raw.map((l) => {
  const el = U.el("div", "msg " + l.who, null, feed);
  if (kind === "terminal" && l.who !== "ai") U.el("span", "ps", "$", el);
  const dots = kind === "chat" && l.who === "ai" ? U.el("span", "dots", null, el) : null;
  if (dots) [0, 1, 2].forEach(() => U.el("i", null, null, dots));
  const tx = U.el("span", null, "", el);
  const caret = typed(l) ? U.el("span", "um-caret", null, el) : null;
  const ch = Array.from(l.text);
  const show = cur;
  const start = show + (dots ? think : 0);
  const dur = ch.length / (typed(l) ? cps : cps * 5);
  cur = start + dur + gap;
  return { el, tx, caret, dots, ch, show, start, end: start + dur };
});
let prompt = null;
if (kind === "terminal") {
  prompt = U.el("div", "msg cmd", null, feed);
  U.el("span", "ps", "$", prompt);
  prompt.caret = U.el("span", "um-caret", null, prompt);
}
const doneAt = lines.length ? lines[lines.length - 1].end : P.at + 0.45;

let foot = null, counts = [];
if (kind === "post") {
  foot = U.el("div", "um-foot", null, win);
  const r = U.seed(Array.from(raw.map((l) => l.text).join("")).length + 7);
  const icons = {
    reply: "M4 5h16v11H9l-5 4z",
    repost: "M7 7h11v4l3-3-3-3v2M17 17H6v-4l-3 3 3 3v-2",
    like: "M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z",
  };
  const fmtK = (v) => (v >= 1000 ? (v / 1000).toFixed(1).replace(".", pl ? "," : ".") + (pl ? " tys." : "K") : String(Math.round(v)));
  counts = [["reply", 40 + Math.floor(r() * 260)], ["repost", 90 + Math.floor(r() * 900)], ["like", 1200 + Math.floor(r() * 8800)]]
    .map(([name, to], i) => {
      const a = U.el("div", "act " + name, null, foot);
      a.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + icons[name] + '"/></svg>';
      const v = U.el("span", null, "0", a);
      return { a, v, to, fmtK, at: doneAt + 0.15 + i * 0.12 };
    });
}

U.clock((t) => {
  const vis = clamp((t - P.at) / 0.25) * clamp((P.end - t) / 0.25);
  box.style.opacity = vis;
  box.style.visibility = vis > 0 ? "visible" : "hidden";
  if (!vis) return;
  const u = clamp((t - P.at) / 0.5);
  win.style.opacity = clamp(u * 2.5);
  win.style.transform = "translateY(" + ((1 - backOut(u)) * 70 * s) + "px) scale(" + (0.93 + 0.07 * backOut(u)) + ")";
  const blink = Math.floor((t - P.at) * 2.2) % 2 === 0 ? 1 : 0;
  let active = -1;
  lines.forEach((l, i) => {
    if (t < l.show) { l.el.style.display = "none"; return; }
    l.el.style.display = "";
    if (t >= l.show) active = i;
    const q = clamp((t - l.show) / 0.3);
    l.el.style.opacity = clamp(q * 2);
    l.el.style.transform = kind === "chat" ? "scale(" + (0.8 + 0.2 * backOut(q)) + ")" : "translateY(" + ((1 - quartOut(q)) * 14 * s) + "px)";
    const thinking = l.dots && t < l.start;
    if (l.dots) {
      l.dots.style.display = thinking ? "" : "none";
      Array.from(l.dots.children).forEach((d, k) => {
        d.style.transform = "translateY(" + (-0.22 * Math.max(0, Math.sin((t - l.show) * 9 - k * 0.9))) + "em)";
      });
    }
    const n = Math.max(0, Math.min(l.ch.length, Math.floor((t - l.start) / (l.end - l.start || 1) * l.ch.length + 1e-6)));
    l.tx.textContent = t >= l.end ? l.ch.join("") : l.ch.slice(0, n).join("");
  });
  const last = lines.length - 1;
  lines.forEach((l, i) => {
    if (!l.caret) return;
    const typing = t >= l.start && t < l.end;
    const tail = !prompt && i === last && t >= l.end;
    l.caret.style.display = (i === active && !(l.dots && t < l.start)) && (typing || tail) ? "" : "none";
    l.caret.style.opacity = typing ? 1 : blink;
  });
  if (prompt) {
    prompt.style.display = t >= doneAt + 0.1 ? "" : "none";
    prompt.caret.style.opacity = blink;
  }
  counts.forEach((c) => {
    const q = quartOut(clamp((t - c.at) / 0.9));
    c.v.textContent = c.fmtK(c.to * q);
    c.a.style.opacity = 0.35 + 0.65 * clamp((t - c.at) / 0.3);
    if (c.a.classList.contains("like")) {
      const on = t >= c.at + 0.5;
      c.a.style.setProperty("--like-fill", on ? "var(--ac)" : "none");
      c.a.style.setProperty("--like-stroke", on ? "var(--ac)" : "currentColor");
      const pop = clamp((t - c.at - 0.5) / 0.35);
      c.a.style.transform = on ? "scale(" + (1 + 0.25 * Math.sin(Math.PI * pop)) + ")" : "";
    }
  });
  const over = feed.offsetHeight - body.clientHeight;
  feed.style.transform = "translateY(" + (-Math.max(0, over)) + "px)";
});
</script>
