  font-size: calc(var(--s) * 25px * var(--fk, 1)); background: color-mix(in srgb, var(--ac) 16%, transparent);
  color: color-mix(in srgb, var(--ac) 80%, var(--ink)); }

<markup><div class="um"></div></markup>
<script>
const s = Math.min(P.w / 1000, P.h / 820);
const kind = ["chat", "terminal", "post", "browser", "app"].includes(P.kind) ? P.kind : "chat";
const box = root.querySelector(".um");
box.classList.add("k-" + kind);
box.style.setProperty("--s", s);
box.style.setProperty("--ac", P.accent || "var(--accent)");
const clamp = (v) => Math.min(1, Math.max(0, v));
const backOut = (u) => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);
const quartOut = (u) => 1 - Math.pow(1 - u, 4);
const pl = P.lang === "pl";
const page = kind === "browser" || kind === "app";
// a light --panel-bg drops the glow (its edge would show against the panel frame)
if (U.panelLight(box)) box.classList.add("lp");

U.el("div", "um-glow", null, box);
const pad = 40 * s;
const win = U.el("div", "um-win", null, box);
Object.assign(win.style, { left: pad + "px", top: pad + "px", width: P.w - 2 * pad + "px", height: P.h - 2 * pad + "px" });
const head = U.el("div", "um-head", null, win);
const titleText = String(P.title || (kind === "terminal" ? "zsh" : kind === "post" ? "cutmate" : "AI"));
if (kind === "browser") {
  [0, 1, 2].forEach(() => U.el("span", "light", null, head));
  const bar = U.el("div", "um-url", null, head);
  bar.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const url = String(P.url || "").replace(/^[a-z]+:\/\//i, "").replace(/^www\./, "");
  const cut = url.indexOf("/");
  U.el("b", null, cut < 0 ? url : url.slice(0, cut), bar);
  if (cut >= 0) U.el("span", null, url.slice(cut), bar);
} else if (kind === "app") {
  U.el("div", "um-logo", titleText.trim().charAt(0).toUpperCase() || "A", head);
  U.el("div", "um-name", P.title ? titleText : "", head);
} else if (kind === "terminal") {
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c) => { U.el("span", "light", null, head).style.background = c; });
  U.el("div", "um-name", titleText, head);
} else {
  U.el("div", "um-av", titleText.trim().charAt(0).toUpperCase() || "A", head);
  const who = U.el("div", null, null, head);
  U.el("div", "um-name", titleText, who);
  const handle = "@" + (titleText.toLowerCase().replace(/[^a-z0-9]+/g, "") || "user");
  U.el("div", "um-sub", kind === "post" ? handle : "online", who);
}
const body = U.el("div", "um-body", null, win);
// the window and its content are readable by U.fullAt (min 0.6 s, 40 % of the span); the clicks, the circle and the
// post counters are later beats spread over the rest of the span
const full = U.fullAt(P.at, P.end), F = full - P.at;
const winDur = Math.min(0.5, F);
if (page) {
  // browser / app: the search is typed and the rows come in one by one by U.fullAt; then, spaced evenly over
  // [fullAt, P.end - 0.4]: (app) the cursor clicks each `click` row, its toggle flips / (browser) circle a row
  const pg = U.el("div", "um-page", null, body);
  if (kind === "browser" && P.title) U.el("div", "um-h", String(P.title), pg);
  let field = null, ftx = null, fcaret = null, fph = null;
  const query = Array.from(String(P.search == null ? "" : P.search));
  if (query.length) {
    field = U.el("div", "um-search", null, pg);
    field.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>';
    fph = U.el("span", "ph", pl ? "Szukaj…" : "Search…", field);
    ftx = U.el("span", null, "", field);
    fcaret = U.el("span", "um-caret", null, field);
  }
  const list = U.el("div", "um-rows", null, pg);
  const rows = (Array.isArray(P.rows) ? P.rows : []).slice(0, 8).map((r) => (r && typeof r === "object" ? r : { text: String(r) }))
    .map((r) => {
      const el = U.el("div", "um-row", null, list);
      if (kind === "app") U.el("div", "um-ic", String(r.text || "").trim().charAt(0).toUpperCase() || "•", el);
      const tx = U.el("div", "um-tx", null, el);
      U.el("div", "um-t", String(r.text == null ? "" : r.text), tx);
      if (r.sub) U.el("div", "um-s", String(r.sub), tx);
      if (r.badge != null && r.badge !== "") U.el("div", "um-badge", String(r.badge), el);
      let tg = null;
      const has = kind === "app" && typeof r.toggle === "boolean";
      if (has) { tg = U.el("div", "tg", null, el); U.el("i", null, null, tg); }
      const clk = kind === "app" && r.click === true;
      // `toggle` is the final state; a clicked row starts the other way and flips at the click
      return { el, tg, to: has ? r.toggle : null, from: has ? (clk ? !r.toggle : r.toggle) : null, clk, click: null };
    });
  const acts = [];
  if (field) acts.push({ type: "type" });
  rows.forEach((r) => acts.push({ type: "row", r }));
  if (kind === "app") rows.filter((r) => r.clk).forEach((r) => acts.push({ type: "click", r }));
  const hi = kind === "browser" && Number.isInteger(P.highlight) && rows[P.highlight] ? rows[P.highlight] : null;
  if (hi) acts.push({ type: "mark", r: hi });
  const build = acts.filter((a) => a.type === "type" || a.type === "row"), later = acts.filter((a) => !build.includes(a));
  const a0 = P.at + Math.min(0.05, F * 0.1), step = Math.max(0.001, full - a0) / Math.max(1, build.length);
  build.forEach((a, k) => { a.t = a0 + k * step; a.d = step; });
  const b1 = Math.max(full + 0.3, P.end - 0.4), lstep = Math.max(0, b1 - full) / Math.max(1, later.length);
  later.forEach((a, k) => { a.t = full + k * lstep; a.d = lstep; });
  acts.forEach((a) => { if (a.r) a.r[a.type] = a; });
  const typeAct = acts.find((a) => a.type === "type");
  const clicks = acts.filter((a) => a.type === "click");

  // cursor (app) and the circle (browser) live in the window, over the page
  const cur = clicks.length ? U.el("div", "um-cur", null, win) : null;
  if (cur) cur.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 3l14 8.2-6.3 1.4L9.6 19z"/></svg>';
  const ring = cur ? U.el("div", "um-ring", null, win) : null;
  const NS = "http://www.w3.org/2000/svg";
  let mark = null;
  if (hi) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "um-mark");
    win.appendChild(svg);
    mark = document.createElementNS(NS, "rect");
    mark.setAttribute("pathLength", "1");
    svg.appendChild(mark);
  }
  const offIn = (el) => {                             // el's box in window coordinates (layout only, no transforms)
    let x = 0, y = 0;
    for (let e = el; e && e !== win; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  };
  // fit: the largest text scale (1.25 … 0.6) at which the finished page fits the window body; then shrink the window
  // to its content (at least 55 %) and centre it; measured once the theme fonts have loaded
  const maxH = P.h - 2 * pad;
  let home = { x: P.w, y: maxH };
  const fitPage = () => {
    Object.assign(win.style, { top: pad + "px", height: maxH + "px" });
    if (ftx) ftx.textContent = query.join("");
    let fk = 0.6;
    for (const k of [1.25, 1.15, 1.05, 1, 0.9, 0.8, 0.7, 0.6]) {
      win.style.setProperty("--fk", k);
      if (pg.offsetHeight <= body.clientHeight) { fk = k; break; }
    }
    win.style.setProperty("--fk", fk);
    const h = Math.min(maxH, Math.max(maxH * 0.55, head.offsetHeight + pg.offsetHeight + 12 * s));
    Object.assign(win.style, { top: (P.h - h) / 2 + "px", height: h + "px" });
    if (ftx) ftx.textContent = "";
    home = { x: (P.w - 2 * pad) * 0.82, y: h * 0.96 };
    rows.forEach((r) => {
      const b = offIn(r.tg ? r.tg : r.el);
      r.aim = r.tg ? { x: b.x + b.w * 0.62, y: b.y + b.h * 0.6 } : { x: b.x + b.w * 0.5, y: b.y + b.h * 0.55 };
      r.box = offIn(r.el);
    });
    if (mark) {
      const b = hi.box, m = 10 * s;
      [["x", b.x - m], ["y", b.y - m * 0.4], ["width", b.w + 2 * m], ["height", b.h + m * 0.8], ["rx", 22 * s]]
        .forEach(([k, v]) => mark.setAttribute(k, v));
    }
  };
  fitPage();
  const dispFam = getComputedStyle(document.documentElement).getPropertyValue("--font-display").trim();
  U.ready(Promise.all([U.fonts([500, 800, 900]), U.fonts([400, 700, 900], dispFam)]).then(fitPage));
  const inOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

  U.clock((t) => {
    const vis = clamp((t - P.at) / 0.25) * clamp((P.end - t) / 0.25);
    box.style.opacity = vis;
    box.style.visibility = vis > 0 ? "visible" : "hidden";
    if (!vis) return;
    const u = clamp((t - P.at) / winDur);
    win.style.opacity = clamp(u * 2.5);
    win.style.transform = "translateY(" + ((1 - backOut(u)) * 70 * s) + "px) scale(" + (0.93 + 0.07 * backOut(u)) + ")";
    const blink = Math.floor((t - P.at) * 2.2) % 2 === 0 ? 1 : 0;
    if (field) {
      const a = typeAct, d = a.d * 0.85;
      const n = Math.max(0, Math.min(query.length, Math.floor((t - a.t) / d * query.length + 1e-6)));
      ftx.textContent = t >= a.t + d ? query.join("") : query.slice(0, n).join("");
      fph.style.display = t >= a.t && (n > 0 || t >= a.t + d) ? "none" : "";
      field.classList.toggle("focus", t >= a.t);
      fcaret.style.display = t >= a.t ? "" : "none";
      fcaret.style.opacity = t >= a.t && t < a.t + d ? 1 : blink;
    }
    rows.forEach((r) => {
      const q = clamp((t - r.row.t) / Math.min(0.3, r.row.d * 0.6));
      r.el.style.visibility = t >= r.row.t ? "visible" : "hidden";
      r.el.style.opacity = t >= r.row.t ? Math.max(0.01, clamp(q * 1.6)) : 0;
      r.el.style.transform = "translateY(" + ((1 - quartOut(q)) * 24 * s) + "px)";
      const at = r.click ? r.click.t + r.click.d * 0.6 : Infinity;    // the press
      if (r.tg) {
        const k = r.to === r.from ? 0 : clamp((t - at) / 0.2);
        const v = r.from ? 1 - k : k;                                // 0 off .. 1 on
        r.tg.style.setProperty("--q", v);
        r.tg.classList.toggle("on", v >= 0.5);
      } else if (r.click) {
        r.el.style.background = t >= at ? "color-mix(in srgb, var(--ac) " + Math.round(14 * clamp((t - at) / 0.15)) + "%, transparent)" : "";
      }
    });
    if (cur) {
      let j = -1;
      clicks.forEach((c, i) => { if (t >= c.t) j = i; });
      const c = clicks[Math.max(0, j)];
      const from = j <= 0 ? home : clicks[j - 1].r.aim, to = j < 0 ? home : c.r.aim;
      const k = j < 0 ? 0 : clamp((t - c.t) / (c.d * 0.55)), press = j < 0 ? -1 : c.t + c.d * 0.6;
      const e = inOut(k), x = from.x + (to.x - from.x) * e, y = from.y + (to.y - from.y) * e;
      const down = press > 0 && t >= press && t < press + 0.12;
      cur.style.opacity = clamp((t - clicks[0].t) / 0.15);
      cur.style.transform = "translate(" + x + "px," + y + "px) scale(" + (down ? 0.86 : 1) + ")";
      const rq = press > 0 ? clamp((t - press) / 0.35) : 0;
      ring.style.opacity = press > 0 && t >= press ? 1 - rq : 0;
      ring.style.transform = "translate(" + x + "px," + y + "px) translate(-50%,-50%) scale(" + (0.3 + 1.1 * quartOut(rq)) + ")";
    }
    if (mark) {
      const a = hi.mark;
      mark.style.strokeDashoffset = String(1 - inOut(clamp((t - a.t) / Math.min(0.5, a.d))));
    }
  });
} else {
  const feed = U.el("div", "um-feed", null, body);

  // lines: typed (chat / post / terminal commands) or printed fast (terminal output)
  const raw = (P.lines || []).map((l) => (typeof l === "string" ? { who: "ai", text: l } : l))
    .map((l) => ({ who: ["user", "ai", "cmd"].includes(l.who) ? l.who : "ai", text: String(l.text == null ? "" : l.text) }));
  const typed = (l) => !(kind === "terminal" && l.who === "ai");
  // every line is shown and typed by U.fullAt: the thinking dots, gaps and typing speed are squeezed into that window
  const think = kind === "chat" ? Math.min(0.5, F * 0.15) : 0;
  const gap = Math.min(kind === "post" ? 0.18 : 0.3, F * 0.06);
  const thinks = raw.filter((l) => kind === "chat" && l.who === "ai").length;
  const chars = raw.reduce((a, l) => a + (typed(l) ? Array.from(l.text).length : Array.from(l.text).length / 5), 0);
  const t0 = P.at + Math.min(0.1, F * 0.1);
  const avail = Math.max(0.01, full - t0 - Math.max(0, raw.length - 1) * gap - thinks * think);
  const cps = Math.max(16, chars / avail);
  const popDur = Math.min(0.3, F * 0.3);
  let cur = t0;
  const lines = raw.map((l) => {
    const el = U.el("div", "msg " + l.who, null, feed);
    if (kind === "terminal" && l.who !== "ai") U.el("span", "ps", "$", el);
    const dots = kind === "chat" && l.who === "ai" ? U.el("span", "dots", null, el) : null;
    if (dots) [0, 1, 2].forEach(() => U.el("i", null, null, dots));
    const tx = U.el("span", null, "", el);
    const caret = typed(l) ? U.el("span", "um-caret", null, el) : null;
    const ch = Array.from(l.text);
    const show = cur;
    const start = show + (dots ? think : 0);
    const dur = ch.length / (typed(l) ? cps : cps * 5);
    cur = start + dur + gap;
    return { el, tx, caret, dots, ch, show, start, end: start + dur };
  });
  let prompt = null;
  if (kind === "terminal") {
    prompt = U.el("div", "msg cmd", null, feed);
    U.el("span", "ps", "$", prompt);
    prompt.caret = U.el("span", "um-caret", null, prompt);
  }
  const doneAt = lines.length ? lines[lines.length - 1].end : t0;

  // post: engagement counters only from P.replies / P.reposts / P.likes (no invented numbers); none given -> no footer
  let foot = null, counts = [];
  const given = [["reply", P.replies], ["repost", P.reposts], ["like", P.likes]].filter(([, v]) => v != null && v !== "");
  if (kind === "post" && given.length) {
    foot = U.el("div", "um-foot", null, win);
    const icons = {
      reply: "M4 5h16v11H9l-5 4z",
      repost: "M7 7h11v4l3-3-3-3v2M17 17H6v-4l-3 3 3 3v-2",
      like: "M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z",
    };
    const fmtK = (v) => (v >= 1000 ? (v / 1000).toFixed(1).replace(".", pl ? "," : ".") + (pl ? " tys." : "K") : String(Math.round(v)));
    counts = given.map(([name, to], i) => {
      const a = U.el("div", "act " + name, null, foot);
      a.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + icons[name] + '"/></svg>';
      const num = typeof to === "number" && isFinite(to);             // numbers count up; text ("1,2 tys.") is shown as is
      const v = U.el("span", null, num ? "0" : String(to), a);
      return { a, v, to, num, fmtK, at: doneAt + 0.15 + i * 0.12 };
    });
  }

  // few / short lines: grow the text (up to 1.7x) while the finished conversation still fits in ~92% of the window body,
  // then shrink the window to its finished content (head + feed + footer) and centre it in the panel, so one message
  // does not leave a mostly empty window; measured once the theme font has loaded (fallback metrics would mis-size it)
  const maxH = P.h - 2 * pad;
  const fit = () => {
    Object.assign(win.style, { top: pad + "px", height: maxH + "px" });
    lines.forEach((l) => { l.tx.textContent = l.ch.join(""); if (l.dots) l.dots.style.display = "none"; });
    let fk = 1;
    for (const k of [1.7, 1.55, 1.4, 1.3, 1.2, 1.1]) {
      win.style.setProperty("--fk", k);
      if (feed.offsetHeight <= body.clientHeight * 0.92) { fk = k; break; }
    }
    win.style.setProperty("--fk", fk);
    const need = head.offsetHeight + feed.offsetHeight + (foot ? foot.offsetHeight : 0) + 8 * s;
    const h = Math.min(maxH, Math.max(maxH * 0.4, need));
    Object.assign(win.style, { top: (P.h - h) / 2 + "px", height: h + "px" });
    lines.forEach((l) => { l.tx.textContent = ""; if (l.dots) l.dots.style.display = ""; });
  };
  fit();
  U.ready(U.fonts([500, 800, 900]).then(fit));

  U.clock((t) => {
    const vis = clamp((t - P.at) / 0.25) * clamp((P.end - t) / 0.25);
    box.style.opacity = vis;
    box.style.visibility = vis > 0 ? "visible" : "hidden";
    if (!vis) return;
    const u = clamp((t - P.at) / winDur);
    win.style.opacity = clamp(u * 2.5);
    win.style.transform = "translateY(" + ((1 - backOut(u)) * 70 * s) + "px) scale(" + (0.93 + 0.07 * backOut(u)) + ")";
    const blink = Math.floor((t - P.at) * 2.2) % 2 === 0 ? 1 : 0;
    let active = -1;
    lines.forEach((l, i) => {
      if (t < l.show) { l.el.style.display = "none"; return; }
      l.el.style.display = "";
      if (t >= l.show) active = i;
      const q = clamp((t - l.show) / Math.max(0.01, Math.min(popDur, full - l.show)));
      l.el.style.opacity = clamp(q * 2);
      l.el.style.transform = kind === "chat" ? "scale(" + (0.8 + 0.2 * backOut(q)) + ")" : "translateY(" + ((1 - quartOut(q)) * 14 * s) + "px)";
      const thinking = l.dots && t < l.start;
      if (l.dots) {
        l.dots.style.display = thinking ? "" : "none";
        Array.from(l.dots.children).forEach((d, k) => {
          d.style.transform = "translateY(" + (-0.22 * Math.max(0, Math.sin((t - l.show) * 9 - k * 0.9))) + "em)";
        });
      }
      const n = Math.max(0, Math.min(l.ch.length, Math.floor((t - l.start) / (l.end - l.start || 1) * l.ch.length + 1e-6)));
      l.tx.textContent = t >= l.end ? l.ch.join("") : l.ch.slice(0, n).join("");
    });
    const last = lines.length - 1;
    lines.forEach((l, i) => {
      if (!l.caret) return;
      const typing = t >= l.start && t < l.end;
      const tail = !prompt && i === last && t >= l.end;
      l.caret.style.display = (i === active && !(l.dots && t < l.start)) && (typing || tail) ? "" : "none";
      l.caret.style.opacity = typing ? 1 : blink;
    });
    if (prompt) {
      prompt.style.display = t >= doneAt + 0.1 ? "" : "none";
      prompt.caret.style.opacity = blink;
    }
    counts.forEach((c) => {
      const q = quartOut(clamp((t - c.at) / 0.9));
      if (c.num) c.v.textContent = c.fmtK(c.to * q);
      c.a.style.opacity = 0.35 + 0.65 * clamp((t - c.at) / 0.3);
      if (c.a.classList.contains("like")) {
        const on = t >= c.at + 0.5;
        c.a.style.setProperty("--like-fill", on ? "var(--ac)" : "none");
        c.a.style.setProperty("--like-stroke", on ? "var(--ac)" : "currentColor");
        const pop = clamp((t - c.at - 0.5) / 0.35);
        c.a.style.transform = on ? "scale(" + (1 + 0.25 * Math.sin(Math.PI * pop)) + ")" : "";
      }
    });
    const over = feed.offsetHeight - body.clientHeight;
    feed.style.transform = "translateY(" + (-Math.max(0, over)) + "px)";
  });
}
</script>
