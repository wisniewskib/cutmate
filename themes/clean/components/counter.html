<script>
const band = U.el("div", "band");
const card = U.el("div", "card", null, band);
const n = U.el("span", "big", null, card);
U.el("span", "label", P.label, card);
const dec = (String(P.to).split(".")[1] || "").length;
const fmt = (v) => {
  const [i, f] = Math.abs(v).toFixed(dec).split(".");
  const sign = v < 0 ? "-" : "";
  return (P.prefix || "") + sign + i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "," + f : "") + (P.suffix || "");
};
n.textContent = fmt(0);
const cv = U.counter(n, fmt);
tl.fromTo(card, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, P.at);
tl.fromTo(cv, { v: 0 }, { v: P.to, duration: 0.6, ease: "expo.out" }, P.at + 0.05);
U.out(band, P.end - 0.2);
</script>
