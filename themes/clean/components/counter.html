<style>
ROOT .card { background: var(--card); color: var(--ink); border-radius: 40px; padding: 36px 56px; box-shadow: var(--shadow); text-align: center; font-family: var(--font); }
ROOT .card .big { display: block; font-family: var(--font-num, var(--font-display)); font-weight: 900; font-size: 190px; line-height: 1; letter-spacing: -4px; }
ROOT .card .label { display: block; font-weight: 800; font-size: 44px; letter-spacing: 0.12em; color: var(--muted); margin-top: 12px; }
html.f169 ROOT .card { border-radius: 28px; padding: 22px 36px; }
html.f169 ROOT .card .big { font-size: 110px; letter-spacing: -2px; }
html.f169 ROOT .card .label { font-size: 26px; margin-top: 8px; }
</style>
<script>
const band = U.el("div", "band");
const card = U.el("div", "card", null, band);
const n = U.el("span", "big", null, card);
U.el("span", "label", P.label, card);
const dec = (String(P.to).split(".")[1] || "").length;
const pl = P.lang === "pl";
const fmt = (v) => {
  const fixed = v.toFixed(dec);
  const [i, f] = fixed.replace("-", "").split(".");
  const neg = fixed.startsWith("-") && Number(fixed) !== 0;
  return (P.prefix || "") + (neg ? "-" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, pl ? "\u00a0" : ",")
    + (f ? (pl ? "," : ".") + f : "") + (P.suffix || "");
};
n.textContent = fmt(0);
const cv = U.counter(n, fmt);
tl.fromTo(card, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, P.at);
tl.fromTo(cv, { v: 0 }, { v: P.to, duration: 0.6, ease: "expo.out" }, P.at + 0.05);
U.out(band, P.end - 0.2);
</script>
