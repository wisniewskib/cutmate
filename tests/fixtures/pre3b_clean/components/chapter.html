<markup><div class="chapter"><span class="ch-num">{{label}}</span><span class="ch-title">{{title}}</span></div></markup>
<script>
const c = root.querySelector(".chapter");
tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, P.at);
tl.fromTo(root.querySelector(".ch-title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, P.at + 0.1);
tl.to(c, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, Math.max(P.at + 0.35, P.end - 0.25));
</script>
