<!doctype html>
<html lang="pl"><head><meta charset="UTF-8" /></head><body><template>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>#gx-01-custom { position: absolute; inset: 0; pointer-events: none; }
#gx-01-custom .fx { width: 10px; height: 10px; }</style>
  <div id="gx-01-custom" data-composition-id="gx-01-custom" data-width="1080" data-height="1920" data-duration="1.2"><div class="fx"></div></div>
  <script>(function () {
    const tl = gsap.timeline({ paused: true });
    const root = document.getElementById("gx-01-custom");
    const P = {"name": "orb", "at": 0.1, "end": 1.2, "lang": "pl", "w": 1080, "h": 1920, "dur": 1.2, "track": [], "vendor": "assets/vendor/"};
    const U = Object.assign(window.CutmateFX.make(tl, root, "gx-01-custom", P), {
      el(tag, cls, text, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent || root).appendChild(e); return e; },
      counter(el, fmt) { const d = {}; let v = 0; Object.defineProperty(d, "v", { get: () => v, set: (n) => { v = n; el.textContent = fmt(n); } }); return d; },
      out(target, t) { tl.to(target, { opacity: 0, y: -30, duration: 0.2, ease: "power2.in", immediateRender: false }, Math.max(0, t)); },
      seed(n) { let a = (n >>> 0) || 1; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
    });

const el = root.querySelector(".fx");
U.follow(el, P.track);
U.clock((t) => { el.style.opacity = String(Math.min(1, t)); });

    tl.set(root, { autoAlpha: 0 }, 0); tl.to(root, { autoAlpha: 1, duration: 0.25 }, P.at); tl.to(root, { autoAlpha: 0, duration: 0.25, immediateRender: false }, Math.max(P.at + 0.25, P.end - 0.25));
    window.__timelines["gx-01-custom"] = tl;
  })();</script>
</template></body></html>
