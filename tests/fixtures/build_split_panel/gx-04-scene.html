  <script>(function () {
    const tl = gsap.timeline({ paused: true });
    const root = document.getElementById("gx-04-scene");
    const P = {"media": "assets/media/m02-s.png", "_scene": true, "at": 0.3, "end": 1.7, "lang": "pl", "fade": 0.25, "kind": "image"};
    const U = {
      el(tag, cls, text, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent || root).appendChild(e); return e; },
      counter(el, fmt) { const d = {}; let v = 0; Object.defineProperty(d, "v", { get: () => v, set: (n) => { v = n; el.textContent = fmt(n); } }); return d; },
      out(target, t) { tl.to(target, { opacity: 0, y: -30, duration: 0.2, ease: "power2.in", immediateRender: false }, Math.max(0, t)); },
      seed(n) { let a = (n >>> 0) || 1; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
    };

// a full-frame cover: P.fade (s) fade in / out (of the whole composition) and a slow 1.00 → 1.06 push
const inner = root.querySelector(".scene-in");
tl.fromTo(root, { autoAlpha: 0 }, { autoAlpha: 1, duration: P.fade, ease: "power2.out" }, P.at);
tl.fromTo(inner, { scale: 1 }, { scale: 1.06, duration: Math.max(P.fade, P.end - P.at), ease: "none" }, P.at);
tl.to(root, { autoAlpha: 0, duration: P.fade, ease: "power2.in", immediateRender: false }, Math.max(P.at + P.fade, P.end - P.fade));

    window.__timelines["gx-04-scene"] = tl;
  })();</script>
